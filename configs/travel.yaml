# Travel-cost calibration. Every knob that changes a result lives here.
seed: 20260914

data:
  # Extracts live in data/raw/ (gitignored). CSV or parquet both work.
  picks_path: data/raw/yowmspd2_picks_past_30days_ranon9.14.26.csv
  locations_path: data/raw/yowmspd2_locations_9.14.26.csv
  layout_path: data/raw/DC_Layout_Paths_6.dxf   # York DC drawing with path/stop layers (full building)
  ts_format: "%m/%d/%Y %I:%M:%S %p"

scope:
  zone: WZPCK        # case-pick face
  uom: CS
  slot_type: F       # master TYPE: F = pick face, R = reserve rack

trip:
  group_keys: [order_id, user_id]   # one operator working one order
  min_picks: 3

legs:
  min_seconds: 1
  max_seconds: 900       # above this the operator was not picking
  max_delta_path: 14000  # full WORK_PATH span of the pick zone

fit:
  n_bins: 40
  isotonic_residual: true

validation:
  holdout_fraction: 0.25

output:
  cost_table_step: 50

paths:
  processed: data/processed/travel
  runs: runs

# --------------------------------------------------------------------------
# Travel network from the layout drawing (scripts/build_travel_network.py)
# Units: drawing inches, AutoCAD World coordinates. See docs/data-notes.md.
# --------------------------------------------------------------------------
network:
  layers:
    paths: [Path_Aisle, Path_Cross]
    stops: {Stop_Rack: rack, Stop_Junction: junction, Stop_Lane: lane, Stop_Dispatch: dispatch, PD_Placeholder: pd}   # PD_Placeholder retired; kept so a stray one is reported
    columns: -ST_R_SD_COL        # rack sections with a building column (checks only)
  snap_tol_in: 0.5               # float noise only; the drawing is exact
  drop_off_mode: provisional     # trip start = Stop_Dispatch (real); drop-off lane = PL convention
                                 # (configs staging:) until the site confirms lane-to-door -> real

staging:
  # Outbound pallet lanes PL01-PL57 -> drawn Stop_Lane circles. Rules agreed
  # Oct 19, provisional until the site confirms lane-to-door. See travel/lanes.py.
  pl_pattern: 'PL(0[1-9]|[1-4][0-9]|5[0-7])'   # A-codes (inbound) and PL60 excluded
  three_lane_min_capacity: 66   # 44 pallets -> 2 lanes, 66/88 -> 3
  group_gap_in: 60              # lanes 50" apart inside a group; groups 192"+ apart

crosswalk:
  # Aisle code -> x of its drawn path. FF is the rightmost (east) aisle.
  aisle_x:
    FF: 180855.63
    GG: 180619.63
    HH: 180383.63
    JJ: 180147.63
    KK: 179911.63
    LL: 179675.63
    MM: 179433.63
    NN: 179197.63
    PP: [178961.63, 178997.5]    # path jogs east below y=205.9
    QQ: 178725.63
    # East of FF (added with the full-building paths). Letters keep running
    # east: EE ... AA, then Z ... A (no I or O). Order matched to the WMS bay
    # structure per aisle (gaps, tunnels, max bay) -- see docs/data-notes.md.
    EE: 181208.63
    DD: [181524.63, 181590.13, 181519.88, 181556.63]   # zig-zag path, 154"-360" (assignment DD vs CC to confirm)
    CC: [181924.63, 181859.13, 181929.38, 181892.63]   # mirror of DD
    BB: 182240.63
    AA: 182576.63
    Z: 182924.63
    Y: 183260.63                 # drawn only down to the y=1544 cross-aisle
    X: 183608.63                 # same
    W: 183944.63
    V: 184292.63
    U: 184628.63
    T: 184976.63
    S: 185312.63
    R: 185660.63
    Q: 185996.63
    P: [186344.63, 186344.67]    # upper and lower sections drawn 0.04" apart
    N: 186680.73
    M: [187028.63, 187029.06]
    L: [187364.63, 187364.99]
    K: [187712.63, 187712.26]
    J: [188048.63, 188048.26]
    H: [188396.63, 188396.26]
    G: 188732.63
    F: 189080.63
    E: 189416.63
    D: 189764.63
    C: 190100.63
    B: 190448.63
    A: 190784.63
  bay_rules:
    odd_side: east
    bays_per_stop: 4             # one pallet per bay, 2 per side per 103" section
    pitch_in: 103.0
    max_bay: 270
    snap_tol_in: 24              # PP207 sits 20" off its stop (west racks offset)
    # Bay 1 at the dock (top, high y). Each segment is anchored to a drawn y.
    segments:
      - {name: top,           first_bay: 1,   last_bay: 76,  first_y: 5571.41, node: rack}
      - {name: half_section,  first_bay: 77,  last_bay: 78,  first_y: 3634.91, node: rack}
      - {name: tunnel_upper,  first_bay: 79,  last_bay: 84,  first_y: 3526.91, node: junction, stepped: false}
      - {name: middle,        first_bay: 85,  last_bay: 184, first_y: 3398.41, node: rack}
      - {name: tunnel_middle, first_bay: 185, last_bay: 190, first_y: 797.91,  node: junction, stepped: false}
      - {name: bottom,        first_bay: 191, last_bay: 270, first_y: 669.41,  node: rack}
